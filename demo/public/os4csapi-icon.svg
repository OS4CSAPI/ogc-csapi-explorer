<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- OS4CSAPI Globe Icon — matches official brand image -->

  <!-- Outer globe circle -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#1a6da0" stroke-width="9"/>

  <!-- Globe grid lines — latitude -->
  <ellipse cx="100" cy="100" rx="86" ry="34" fill="none" stroke="#1a6da0" stroke-width="4.5"/>
  <ellipse cx="100" cy="100" rx="86" ry="60" fill="none" stroke="#1a6da0" stroke-width="3" opacity="0.45"/>

  <!-- Globe grid lines — longitude -->
  <ellipse cx="100" cy="100" rx="34" ry="86" fill="none" stroke="#1a6da0" stroke-width="4.5"/>
  <line x1="14" y1="100" x2="186" y2="100" stroke="#1a6da0" stroke-width="3.5"/>
  <line x1="100" y1="14" x2="100" y2="186" stroke="#1a6da0" stroke-width="3.5"/>

  <!-- Network connection lines -->
  <line x1="64" y1="72" x2="100" y2="102" stroke="#1a6da0" stroke-width="3"/>
  <line x1="100" y1="102" x2="142" y2="70" stroke="#1a6da0" stroke-width="3"/>
  <line x1="100" y1="102" x2="68" y2="138" stroke="#1a6da0" stroke-width="3"/>
  <line x1="100" y1="102" x2="144" y2="128" stroke="#1a6da0" stroke-width="3"/>

  <!-- Green arc from left node upward to green node -->
  <path d="M 64 72 Q 38 32, 66 22" fill="none" stroke="#7ab641" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Green highlight node -->
  <circle cx="66" cy="22" r="11" fill="#7ab641"/>

  <!-- Network nodes (blue) -->
  <circle cx="64" cy="72" r="7.5" fill="#1a6da0"/>
  <circle cx="100" cy="102" r="8.5" fill="#1a6da0"/>
  <circle cx="142" cy="70" r="7.5" fill="#1a6da0"/>
  <circle cx="68" cy="138" r="7.5" fill="#1a6da0"/>
  <circle cx="144" cy="128" r="7.5" fill="#1a6da0"/>
</svg>
