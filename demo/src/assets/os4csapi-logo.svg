<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!-- OS4CSAPI Logo — Globe + Text -->

  <!-- Outer globe circle -->
  <circle cx="100" cy="95" r="80" fill="none" stroke="#1a5276" stroke-width="7.5"/>

  <!-- Globe grid lines — latitude -->
  <ellipse cx="100" cy="95" rx="80" ry="32" fill="none" stroke="#1a5276" stroke-width="3.5"/>
  <ellipse cx="100" cy="95" rx="80" ry="58" fill="none" stroke="#1a5276" stroke-width="2.5" opacity="0.5"/>

  <!-- Globe grid lines — longitude -->
  <ellipse cx="100" cy="95" rx="32" ry="80" fill="none" stroke="#1a5276" stroke-width="3.5"/>
  <line x1="20" y1="95" x2="180" y2="95" stroke="#1a5276" stroke-width="2.5"/>
  <line x1="100" y1="15" x2="100" y2="175" stroke="#1a5276" stroke-width="2.5"/>

  <!-- Network connection lines -->
  <line x1="62" y1="65" x2="100" y2="95" stroke="#1a5276" stroke-width="2.5"/>
  <line x1="100" y1="95" x2="140" y2="68" stroke="#1a5276" stroke-width="2.5"/>
  <line x1="100" y1="95" x2="66" y2="132" stroke="#1a5276" stroke-width="2.5"/>
  <line x1="100" y1="95" x2="142" y2="124" stroke="#1a5276" stroke-width="2.5"/>

  <!-- Green arc -->
  <path d="M 62 65 Q 42 30, 74 22" fill="none" stroke="#5dae3e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Green highlight node -->
  <circle cx="74" cy="22" r="9" fill="#5dae3e"/>

  <!-- Network nodes -->
  <circle cx="62" cy="65" r="6" fill="#1a5276"/>
  <circle cx="100" cy="95" r="7" fill="#1a5276"/>
  <circle cx="140" cy="68" r="6" fill="#1a5276"/>
  <circle cx="66" cy="132" r="6" fill="#1a5276"/>
  <circle cx="142" cy="124" r="6" fill="#1a5276"/>

  <!-- OS4CSAPI text -->
  <text x="100" y="210" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="26" fill="#1a5276" letter-spacing="1">OS4CSAPI</text>
  <text x="100" y="235" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="9.5" fill="#4a7fa5" letter-spacing="0.5">Open Source for OGC API — Connected Systems</text>
</svg>
