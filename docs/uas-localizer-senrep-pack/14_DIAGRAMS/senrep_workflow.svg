<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="420" viewBox="0 0 1150 420">
<style>
  .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:8; ry:8; }
  .warn { fill:#fef2f2; stroke:#b91c1c; stroke-width:2; rx:8; ry:8; }
  .ok { fill:#ecfdf5; stroke:#15803d; stroke-width:2; rx:8; ry:8; }
  .text { font-family:Arial, sans-serif; font-size:20px; fill:#111827; }
  .small { font-family:Arial, sans-serif; font-size:15px; fill:#374151; }
  .arrow { stroke:#475569; stroke-width:3; marker-end:url(#arrow); fill:none; }
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>

<rect x="40" y="140" width="250" height="100" class="box"/>
<text x="165" y="175" text-anchor="middle" class="text">Location Estimate</text>
<text x="165" y="200" text-anchor="middle" class="small">gold dot / CEP</text>
<text x="165" y="225" text-anchor="middle" class="small">sourceFixObsId</text>

<rect x="440" y="120" width="260" height="140" class="warn"/>
<text x="570" y="158" text-anchor="middle" class="text">SET-A Review / Report</text>
<text x="570" y="185" text-anchor="middle" class="small">assign contactId</text>
<text x="570" y="210" text-anchor="middle" class="small">prepare SENREP</text>
<text x="570" y="235" text-anchor="middle" class="small">capture provenance + confidence</text>

<rect x="850" y="100" width="260" height="90" class="ok"/>
<text x="980" y="135" text-anchor="middle" class="text">SENREP Observation</text>
<text x="980" y="160" text-anchor="middle" class="small">formal report product</text>

<rect x="850" y="230" width="260" height="90" class="ok"/>
<text x="980" y="265" text-anchor="middle" class="text">Track SamplingFeature</text>
<text x="980" y="290" text-anchor="middle" class="small">uid = urn:os4csapi:track:{contactId}</text>

<path d="M290 190 C350 190, 370 190, 440 190" class="arrow"/>
<path d="M700 165 C760 165, 790 150, 850 145" class="arrow"/>
<path d="M700 215 C760 215, 790 260, 850 275" class="arrow"/>
</svg>
