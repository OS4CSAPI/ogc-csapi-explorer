# OS4CSAPI Simulator — Fly.io deployment config
# Deploy with:  flyctl launch --config simulator/fly.toml
#               flyctl deploy --config simulator/fly.toml

app = "os4csapi-simulator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
